<body>

    <canvas id="particle-canvas"></canvas>

    
<header>

    </div>
    <div class="header-right">
        <button class="cart-btn" id="cartOpenBtn">
            <i class="fa-solid fa-cart-shopping"></i>

    </div>
</header>

<div class="hero-logo">
    <img src="./EA KOTAK.png" alt="EA Logo">
</div>

<section class="hero">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>

    <div class="hero-content">
            <h1 class="hero-title">
                All-encompassing solutions

                for your <span class="editorial">everyday</span> needs
            </h1>

            <p class="hero-subtitle">
                Your <span class="editorial">all-in-one</span> labs,
                always served with <span class="editorial">passion</span>

        <div class="hero-buttons">

<main class="container">
        <div class="filter-section">

                <div class="categories" id="brandContainer"></div>
            </div>
            <div class="categories-wrapper">
                <button class="scroll-btn" onclick="scrollFilter('categoryContainer', -200)">&#8249;</button>
                <div class="categories" id="categoryContainer"></div>
                <button class="scroll-btn" onclick="scrollFilter('categoryContainer', 200)">&#8250;</button>
            </div>
        </div>
        
        <div class="product-grid" id="productGrid">
            <!-- Kartu Produk Dimuat di Sini -->
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Keranjang Belanja</h2>
            <button class="close-cart" id="cartCloseBtn"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-footer" id="cartFooter" style="display: none;">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalValue">Rp 0</span>
            </div>
            <div class="cart-form">
                <div class="form-group-cart">
                    <label for="custName">Nama</label>
                    <input type="text" id="custName" class="cart-input" placeholder="Nama kamu" required>
                </div>
                <div class="form-group-cart">
                    <label for="custOutlet">Outlet</label>
                    <input type="text" id="custOutlet" class="cart-input" placeholder="Nama outlet/cabang" required>
                </div>
                <div class="form-group-cart">
                    <label for="custNotes">Notes</label>
                    <textarea id="custNotes" class="cart-input" rows="2" placeholder="Catatan tambahan... (opsional)"></textarea>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled>Pesan</button>
        </div>
    </div>

    <!-- Checkout Prompt Modal -->
    <div class="custom-alert-overlay" id="checkoutPromptOverlay">
        <div class="custom-alert-box">
            <h3 class="alert-title" style="margin-bottom: 1.5rem;">Lengkapi Data Pesanan</h3>
            <div class="cart-form" style="margin-bottom: 0;">
                <div class="form-group-cart">
                    <label for="promptName">Nama Kamu</label>
                    <input type="text" id="promptName" class="cart-input" placeholder="Masukkan nama..." required>
                </div>
                <div class="form-group-cart">
                    <label for="promptOutlet">Outlet / Cabang</label>
                    <input type="text" id="promptOutlet" class="cart-input" placeholder="Masukkan outlet..." required>
                </div>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="alert-close-btn btn-cancel" id="promptCancelBtn" style="flex: 1;">Batal</button>
                <button class="alert-close-btn" id="promptSubmitBtn" style="flex: 1;">Lanjut</button>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="custom-alert-overlay" id="customAlertOverlay">
        <div class="custom-alert-box">
            <i class="fa-solid fa-circle-exclamation alert-icon"></i>
            <h3 class="alert-title">Perhatian</h3>
            <p class="alert-message" id="customAlertMessage">Pesan error di sini.</p>
            <button class="alert-close-btn" id="customAlertCloseBtn">Mengerti</button>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
    <script>
        // Proteksi Konten
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (
                (e.ctrlKey && ['s','u','a','c','p'].includes(e.key.toLowerCase())) ||
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase()))
            ) {
                e.preventDefault();
            }
        });

        // Particle background script
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        class Particle {
            constructor(x, y, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                this.y += this.directionY;
                if (this.y < 0) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
                this.draw();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = 120;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 1.5) + 0.5;
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let directionY = (Math.random() * -0.3) - 0.1;
                let color = `rgba(255, 255, 255, ${Math.random() * 0.4 + 0.2})`;
                particlesArray.push(new Particle(x, y, directionY, size, color));
            }
        }

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
        }

        initParticles();
        animateParticles();
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            header.classList.toggle('scrolled', window.scrollY > 10);
            const scrollBtn = document.getElementById('scrollTopBtn');
            scrollBtn.classList.toggle('visible', window.scrollY > 200);
        });
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

      
    </script>
</body>
