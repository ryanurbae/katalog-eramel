<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Data CSV ke Supabase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f8fafc;
            --text: #334155;
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 2rem; }
        
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .warning-banner { background-color: #fee2e2; color: #b91c1c; padding: 1rem; border-radius: 8px; border-left: 4px solid #ef4444; margin-bottom: 2rem; font-weight: 600; text-align: center; }
        
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.75rem; }
        
        /* Form Auth */
        #authSection { display: flex; flex-direction: column; max-width: 400px; margin: 2rem auto; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        .form-control:focus { border-color: var(--primary); }
        
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; display: inline-block; text-align: center; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-outline { background-color: white; color: var(--text); border: 1px solid var(--border); }
        
        #loginError { color: var(--danger); margin-bottom: 1rem; display: none; font-size: 0.875rem; }
        
        /* Import Section */
        #importSection { display: none; }
        .textarea-container { margin-bottom: 1.5rem; }
        textarea { width: 100%; height: 200px; padding: 1rem; border: 1px solid var(--border); border-radius: 6px; font-family: monospace; white-space: pre; resize: vertical; outline: none; }
        textarea:focus { border-color: var(--primary); }
        
        .actions { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; }
        
        .table-responsive { overflow-x: auto; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 8px; max-height: 400px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        th { background: #f8fafc; font-weight: 600; position: sticky; top: 0; }
        
        .status-valid { color: var(--success); font-weight: bold; }
        .status-invalid { color: var(--danger); font-weight: bold; }
        .row-invalid { background-color: #fef2f2; }
        
        #progressText { font-weight: 500; margin-left: auto; }
        #summaryText { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; font-weight: 600; text-align: center; }
        .summary-success { background: #d1fae5; color: #047857; }
        .summary-error { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <div class="warning-banner">
        <i class="fa-solid fa-triangle-exclamation"></i> 
        Halaman ini hanya untuk import awal. Hapus file ini setelah selesai agar aman.
    </div>

    <div class="container">
        <h1>Import Produk via CSV</h1>
        
        <!-- SECTION LOGIN -->
        <div id="authSection">
            <p style="margin-bottom: 1rem; color: #64748b;">Silakan login untuk memverifikasi hak akses tulis ke database (RLS).</p>
            <div id="loginError">Email atau password salah.</div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginBtn">Masuk</button>
            </form>
        </div>

        <!-- SECTION IMPORT -->
        <div id="importSection">
            <div class="textarea-container">
                <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Paste isi file CSV (Brand, Kategori, Nama Produk, Harga, URL Gambar)</label>
                <textarea id="csvInput" placeholder='Contoh:&#10;Fore Coffee,Sunny Burst Series,Orange Cream Toffee Latte,"Rp 37,000",'></textarea>
            </div>
            
            <div class="actions">
                <button class="btn btn-primary" id="previewBtn">Preview Data</button>
                <button class="btn btn-success" id="importBtn" disabled>Import ke Supabase</button>
                <button class="btn btn-outline" id="resetBtn">Reset</button>
                <div id="progressText"></div>
            </div>

            <div id="summaryText"></div>

            <div class="table-responsive">
                <table id="previewTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Brand</th>
                            <th>Kategori</th>
                            <th>Nama Produk</th>
                            <th>Harga (Numeric)</th>
                            <th>URL Gambar</th>
                        </tr>
                    </thead>
                    <tbody id="previewBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./supabase-config.js";

        // DOM Elements
        const authSection = document.getElementById('authSection');
        const importSection = document.getElementById('importSection');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        
        const csvInput = document.getElementById('csvInput');
        const previewBtn = document.getElementById('previewBtn');
        const importBtn = document.getElementById('importBtn');
        const resetBtn = document.getElementById('resetBtn');
        const previewTable = document.getElementById('previewTable');
        const previewBody = document.getElementById('previewBody');
        
        const progressText = document.getElementById('progressText');
        const summaryText = document.getElementById('summaryText');

        // State
        let parsedProducts = [];
        let validProducts = [];

        // --- Authentication ---
        async function checkSession() {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                authSection.style.display = 'none';
                importSection.style.display = 'block';
            }
        }
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.textContent = 'Memproses...';
            loginBtn.disabled = true;
            loginError.style.display = 'none';

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                loginError.textContent = error.message;
                loginError.style.display = 'block';
                loginBtn.textContent = 'Masuk';
                loginBtn.disabled = false;
            } else {
                checkSession();
            }
        });

        // --- CSV Parser (Manual implementation for Quoted fields) ---
        function parseCSV(text) {
            let result = [];
            let row = [];
            let inQuotes = false;
            let currentValue = '';

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i + 1];

                // Handle escaped quotes ("")
                if (char === '"' && inQuotes && nextChar === '"') {
                    currentValue += '"';
                    i++; // skip next quote
                } 
                // Toggle quote state
                else if (char === '"') {
                    inQuotes = !inQuotes;
                } 
                // End of field
                else if (char === ',' && !inQuotes) {
                    row.push(currentValue.trim());
                    currentValue = '';
                } 
                // End of row (\n or \r\n)
                else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++; // skip \n
                    }
                    row.push(currentValue.trim());
                    result.push(row);
                    row = [];
                    currentValue = '';
                } 
                // Regular characters
                else {
                    currentValue += char;
                }
            }
            
            // Push the last field/row if not empty
            if (currentValue !== '' || row.length > 0) {
                row.push(currentValue.trim());
                result.push(row);
            }

            // Filter out empty rows
            return result.filter(r => r.join('').trim() !== '');
        }

        // --- Logic Preview ---
        previewBtn.addEventListener('click', () => {
            const rawData = csvInput.value.trim();
            if (!rawData) {
                alert("CSV Kosong!");
                return;
            }

            const rows = parseCSV(rawData);
            parsedProducts = [];
            validProducts = [];
            previewBody.innerHTML = '';

            // Periksa baris (Abaikan baris pertama jika itu Header)
            let startIndex = 0;
            if (rows[0] && rows[0][0].toLowerCase().includes("brand")) {
                startIndex = 1;
            }

            for (let i = startIndex; i < rows.length; i++) {
                const row = rows[i];
                // Ambil data sesuai index kolom
                const brand = row[0] || '';
                const category = row[1] || '';
                const name = row[2] || '';
                const rawPrice = row[3] || '';
                const imageUrl = row[4] || null;

                // Konversi harga: Hapus "Rp " dan koma, ubah ke angka float
                const cleanPriceStr = rawPrice.replace(/Rp\s?/gi, '').replace(/,/g, '');
                const price = parseFloat(cleanPriceStr);

                // Validasi
                const isValid = name !== '' && !isNaN(price) && brand !== '';
                
                const productObj = {
                    brand: brand,
                    category: category,
                    name: name,
                    price: price,
                    image_url: imageUrl
                };

                parsedProducts.push({ valid: isValid, data: productObj });
                if (isValid) validProducts.push(productObj);

                // Render TR
                previewBody.innerHTML += `
                    <tr class="${isValid ? '' : 'row-invalid'}">
                        <td>${isValid ? '<span class="status-valid">Valid</span>' : '<span class="status-invalid">Invalid</span>'}</td>
                        <td>${brand}</td>
                        <td>${category}</td>
                        <td>${name || '<span style="color:red">KOSONG</span>'}</td>
                        <td>${isValid ? price : '<span style="color:red">Unparsable: ' + rawPrice + '</span>'}</td>
                        <td>${imageUrl ? 'Ada URL' : '-'}</td>
                    </tr>
                `;
            }

            previewTable.style.display = 'table';
            progressText.textContent = `Preview: ${validProducts.length} baris valid dari total ${parsedProducts.length} baris.`;
            progressText.style.color = validProducts.length > 0 ? "inherit" : "red";
            
            importBtn.disabled = validProducts.length === 0;
            summaryText.style.display = 'none';
        });

        // --- Logic Import ---
        importBtn.addEventListener('click', async () => {
            if (validProducts.length === 0) return;
            
            importBtn.disabled = true;
            previewBtn.disabled = true;
            progressText.textContent = `Mengimport... 0 dari ${validProducts.length} produk`;

            try {
                const { data, error } = await supabase.from('products').insert(validProducts);
                
                if (error) throw error;

                progressText.textContent = "";
                summaryText.textContent = `Berhasil: ${validProducts.length} produk diimport | Gagal: ${parsedProducts.length - validProducts.length} baris terabaikan`;
                summaryText.className = "summary-success";
                summaryText.style.display = "block";

            } catch (error) {
                console.error("Import Error: ", error);
                summaryText.textContent = `Terjadi kesalahan saat import: ${error.message}`;
                summaryText.className = "summary-error";
                summaryText.style.display = "block";
                importBtn.disabled = false;
            }
            previewBtn.disabled = false;
        });

        // --- Logic Reset ---
        resetBtn.addEventListener('click', () => {
            csvInput.value = '';
            previewBody.innerHTML = '';
            previewTable.style.display = 'none';
            parsedProducts = [];
            validProducts = [];
            importBtn.disabled = true;
            progressText.textContent = '';
            summaryText.style.display = 'none';
        });

        // Initialize
        checkSession();
    </script>
</body>
</html>
